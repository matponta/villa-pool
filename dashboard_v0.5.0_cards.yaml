# Cards for v0.5.0. APPLIED to the live dashboard on 2026-09-17, after the HACS
# upgrade — they reference entities that do not exist before it.
#
# The inverse, if they ever have to come out (section 8; remove the high indices
# first, or they shift under you):
#
#   [{"op": "remove", "path": "/views/0/sections/8/cards/35"},   # air graph
#    {"op": "remove", "path": "/views/0/sections/8/cards/34"},   # cop graph
#    {"op": "remove", "path": "/views/0/sections/8/cards/33"},   # air tile
#    {"op": "remove", "path": "/views/0/sections/8/cards/32"},   # cop tile
#    {"op": "remove", "path": "/views/0/sections/8/cards/31"},   # session card
#    {"op": "remove", "path": "/views/0/sections/8/cards/3"}]    # topup switch
#
# (Verified in place 2026-09-17: the switch went in at 3, which pushed the
# session block from 30.. to 31.. — hence these indices and not the ones the
# patch was written with.)
#
# ENTITY IDS: live ids carry the device name, so `pool_poolbrain_*`. See
# CLAUDE.md → "The live entity ids are not the §4 ids".

# 1 · Settings section, next to the other PdC switches.
- type: tile
  entity: switch.pool_poolbrain_grid_day_topup
  name: Rabbocco diurno da rete (F1)
  icon: mdi:weather-sunny-alert
  color: amber
  grid_options:
    columns: 12
    rows: 1

# 2 · Diagnostics — the §5.4 session log. This is the surface that turns the COP
#     model from a guess into something fittable, so it is worth its own block.
- type: markdown
  grid_options:
    columns: full
    rows: auto
  content: >-
    {% set c = 'sensor.pool_poolbrain_last_session_cop' %}{% if
    states(c) not in ['unknown','unavailable','none'] or
    state_attr(c,'minutes') %}**Ultima sessione di riscaldamento** — {{
    state_attr(c,'mode') | upper }} · {{ state_attr(c,'minutes') }} min · acqua
    {{ state_attr(c,'water_start') }} → {{ state_attr(c,'water_end') }} °C ({{
    state_attr(c,'delta_t') }} K) · {{ state_attr(c,'energy_kwh') }} kWh · aria
    {{ state_attr(c,'air_mean') }} °C

    {% if states(c) not in ['unknown','unavailable','none'] %}

    **COP misurato {{ states(c) }}**{% if state_attr(c,'clean') %} — sessione
    notturna, utilizzabile per tarare il modello.{% else %} — ⚠️ diurna: il sole
    ha fatto parte del lavoro e il compressore se ne prende il merito. È un
    limite superiore, non una misura.{% endif %}

    {% else %}

    Nessun COP per questa sessione: {{ state_attr(c,'note') or '—' }}.

    {% endif %}{% else %}

    Nessuna sessione ancora registrata. Ne serve una completa — il supervisore
    deve averne visto sia l'inizio sia la fine.

    {% endif %}

# 3 · Two tiles beside it, so COP and air temperature are both graphable.
- type: tile
  entity: sensor.pool_poolbrain_last_session_cop
  name: COP ultima sessione
  icon: mdi:gauge-full
  grid_options:
    columns: 6
    rows: 1
- type: tile
  entity: sensor.pool_poolbrain_last_session_air_temp
  name: Aria media ultima sessione
  icon: mdi:thermometer-lines
  grid_options:
    columns: 6
    rows: 1

# 4 · The fit itself, once there are a few clean points. TWO graphs, not one:
#     `statistics-graph` wants a single unit across its entities, and COP is
#     unitless while the air is °C. Same time axis, so the relationship is still
#     readable by eye — and long-term statistics survive the recorder purge,
#     which a history-graph over 30 days would not.
- type: statistics-graph
  title: COP misurato — solo le sessioni notturne tarano il modello
  chart_type: line
  period: day
  days_to_show: 30
  stat_types:
    - mean
  entities:
    - entity: sensor.pool_poolbrain_last_session_cop
      name: COP misurato
  grid_options:
    columns: full
    rows: 3
- type: statistics-graph
  title: Aria media durante le sessioni
  chart_type: line
  period: day
  days_to_show: 30
  stat_types:
    - mean
  entities:
    - entity: sensor.pool_poolbrain_last_session_air_temp
      name: Aria media
  grid_options:
    columns: full
    rows: 3
